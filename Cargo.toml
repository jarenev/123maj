[package]
name = "majestic"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "majestic"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
